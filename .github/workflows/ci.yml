name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline tests
        run: bash tests/run.sh

      - name: CLI help / version
        run: |
          bash skills/tzai-image/scripts/tzai-image --version
          bash skills/tzai-image/scripts/tzai-image kinds | head -20
