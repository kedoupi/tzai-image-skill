name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Offline tests
        run: bash tests/run.sh

      - name: CLI help / version
        run: |
          bash skills/tzai-image/scripts/tzai-image --version
          bash skills/tzai-image/scripts/tzai-image kinds >/dev/null
